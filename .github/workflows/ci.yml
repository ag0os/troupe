name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: TypeScript + Biome checks
        run: bun run check:all

      - name: Tests
        run: bun test

  # The Shepherd evals gate (docs/SHEPHERD-EVALS.md). It runs on every pull
  # request so the required status always appears, and it runs no model and
  # needs no credentials.
  shepherd-evals:
    name: shepherd-evals
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out the PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No PR script runs before the verifier hashes the tree.
      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Shepherd evals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun evals/shepherd/verify.ts --base "$BASE_SHA" --head "$HEAD_SHA"
